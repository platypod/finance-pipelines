# Generic starter rules for common French merchants. First match wins; the private rules.yaml next to the
# statements is consulted BEFORE these. Regexes are PostgreSQL (ARE, case-insensitive): \m \M are word
# boundaries. They run against the cleaned merchant string (card payments) or the label (transfers, debits).
# Keep personal knowledge (your local shops, your employer) in the private file, not here: this repo is public.
version: 1
rules:
  # --- structural (by operation family) ---
  - {id: interest, family: interest, set: {category: income, subcategory: interest}}
  - {id: cash, family: cash, set: {category: cash, subcategory: cash_withdrawal, necessity: comfort}}
  - {id: card-fee, family: fees, set: {category: taxes_fees, subcategory: bank_fees, necessity: essential}}
