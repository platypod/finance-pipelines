[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platypod-pipeline"
version = "0.1.0"
description = "Instrumented, contract-bound data pipelines for the platypod finance platform"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6",
  "pdfplumber>=0.11",
  "requests>=2.31",
  "opentelemetry-proto>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "openlineage-python~=1.53",
  "openlineage-dbt~=1.53",
  "datacontract-cli[postgres]~=1.2",
  "dbt-core~=1.12.5",
  "dbt-postgres~=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pp = "platypod_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Postgres (set FINANCE_PG_HOST etc.)"]
